[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
logfile_maxbytes=20MB
logfile_backups=1

[program:napcat]
command=/app/start_napcat.sh
autostart=true
autorestart=true
startsecs=10
startretries=20
stdout_logfile=/tmp/napcat.out.log
stderr_logfile=/tmp/napcat.err.log

[program:bot]
; 用独立安装的 Node 22 跑 bot，保证全局 WebSocket 可用
command=/opt/node22/bin/node --experimental-websocket /app/bot.js
autostart=true
autorestart=true
startsecs=5
startretries=20
; bot.js 直接读 process.env（NAPCAT_WS_URL / NAPCAT_TOKEN / LLM_*），
; 这些变量由 Koyeb 平台注入，supervisord 会原样继承给子进程，无需在此重复声明。
stdout_logfile=/tmp/bot.out.log
stderr_logfile=/tmp/bot.err.log
